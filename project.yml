name: Signet
options:
  bundleIdPrefix: org.tezos
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Signet:
    type: application
    platform: macOS
    sources:
      - path: Signet
        excludes:
          - "Resources/taquito-bridge.js"
      - path: Signet/Resources/taquito-bridge.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tezos.signet
        PRODUCT_NAME: Signet
        INFOPLIST_FILE: Signet/Info.plist
        CODE_SIGN_ENTITLEMENTS: Signet/Signet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  SignetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SignetTests
    dependencies:
      - target: Signet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tezos.signet.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Signet:
    build:
      targets:
        Signet: all
        SignetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SignetTests
