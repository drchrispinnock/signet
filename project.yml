name: Signet
options:
  bundleIdPrefix: org.tezos
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  # Self-updating (Check for Updates…), as iTerm2 and NetNewsWire do. The app checks the
  # appcast named by SUFeedURL in Info.plist; releases are signed by generate_appcast.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Signet:
    type: application
    platform: macOS
    sources:
      - path: Signet
        excludes:
          - "Resources/taquito-bridge.js"
      - path: Signet/Resources/taquito-bridge.js
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tezos.signet
        PRODUCT_NAME: Signet
        INFOPLIST_FILE: Signet/Info.plist
        CODE_SIGN_ENTITLEMENTS: Signet/Signet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.0"   # overwritten from git tags by scripts/stamp-version.sh
        CURRENT_PROJECT_VERSION: "1"
    postBuildScripts:
      - name: Stamp version from git
        path: scripts/stamp-version.sh
        basedOnDependencyAnalysis: false
  SignetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SignetTests
    dependencies:
      - target: Signet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tezos.signet.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Signet:
    build:
      targets:
        Signet: all
        SignetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SignetTests
