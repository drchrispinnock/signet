name: Release

# Pushing a tag like v0.2 builds the app and attaches Signet-0.2.zip to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build number = commit count

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        # Optional. Add DEVELOPER_ID_P12 (base64 .p12), DEVELOPER_ID_P12_PASSWORD and
        # DEVELOPER_ID (the identity name) as repository secrets to sign for distribution.
        if: ${{ secrets.DEVELOPER_ID_P12 != '' }}
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Store notarisation credentials
        # Optional. NOTARY_APPLE_ID, NOTARY_TEAM_ID and NOTARY_PASSWORD (an app-specific password).
        if: ${{ secrets.NOTARY_APPLE_ID != '' }}
        run: |
          xcrun notarytool store-credentials signet-notary \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" \
            --password "${{ secrets.NOTARY_PASSWORD }}"
          echo "NOTARY_PROFILE=signet-notary" >> "$GITHUB_ENV"

      - name: Build release zip
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Signet $GITHUB_REF_NAME" --generate-notes
