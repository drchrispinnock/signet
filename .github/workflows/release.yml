name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Pushing a tag like v0.2 builds the app and attaches Signet-0.2.zip to a GitHub release, plus
# appcast.xml so running copies of Signet find the update (Sparkle reads
# releases/latest/download/appcast.xml). The appcast is signed with the SPARKLE_PRIVATE_KEY
# secret (the output of Sparkle's `generate_keys -x`); publication requires this key.
#
# Fail closed (S25): the release is created as a draft, so `releases/latest` never points at a
# release whose build failed or whose assets are incomplete; it is published only after the zip
# and the appcast are both attached. The committed bridge bundle must match a clean rebuild from
# the lockfile, and the offline bridge regression must pass, before anything is archived.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # A hung step fails the run instead of holding the runner for GitHub's six-hour limit.
    timeout-minutes: 45
    env:
      # The secrets context cannot be used in step `if`s, so surface presence as job env.
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.DEVELOPER_ID != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # build number = commit count

      - name: Require the update signing key
        run: |
          if [ "$HAS_SPARKLE_KEY" != "true" ]; then
            echo "::error::A published update requires SPARKLE_PRIVATE_KEY and a signed appcast"; exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        # Optional. Add DEVELOPER_ID_P12 (base64 .p12), DEVELOPER_ID_P12_PASSWORD and
        # DEVELOPER_ID (the identity name) as repository secrets to sign for distribution.
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          # The identity is only "valid" with Apple's Developer ID G2 intermediate alongside it.
          curl -sSfO https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          # A new keychain locks itself after 300 s of inactivity, and a locked keychain makes
          # codesign wait for a password prompt that never comes: the 0.9.6 archive hung for
          # two hours twice, because the test step before it had grown past five minutes. Keep
          # it unlocked for the whole job (no lock on sleep, six-hour timeout).
          security set-keychain-settings -lut 21600 build.keychain
          rm cert.p12
          echo "DEVELOPER_ID=${{ secrets.DEVELOPER_ID }}" >> "$GITHUB_ENV"

      - name: Store notarisation credentials
        # Optional. NOTARY_APPLE_ID, NOTARY_TEAM_ID and NOTARY_PASSWORD (an app-specific password).
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY == 'true'
        run: |
          xcrun notarytool store-credentials signet-notary \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" \
            --password "${{ secrets.NOTARY_PASSWORD }}"
          echo "NOTARY_PROFILE=signet-notary" >> "$GITHUB_ENV"

      - name: Check the committed bridge bundle and run its offline regressions
        # The shipped taquito-bridge.js must be exactly what the lockfile builds; a bundle edited
        # by hand or built from other dependencies fails the release here.
        working-directory: TaquitoBridge
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../Signet/Resources/taquito-bridge.js || {
            echo "::error::Signet/Resources/taquito-bridge.js differs from a clean build of TaquitoBridge; rebuild and commit it"; exit 1; }
          npm test

      - name: Run isolated native regressions
        env:
          TEST_RUNNER_SIGNET_NETWORK_TESTS: '0'
          TEST_RUNNER_SIGNET_REAL_WALLET_TESTS: '0'
        run: |
          xcodegen generate
          xcodebuild -project Signet.xcodeproj -scheme Signet -destination 'platform=macOS' -derivedDataPath build/ci-tests test

      - name: Create GitHub release (draft)
        # Created first (as a draft, without assets) so its generated notes can go into the
        # appcast. A draft is invisible to releases/latest, so a failed build never becomes the
        # update feed. Safe to rerun: an existing release is kept (its notes included).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "Signet $GITHUB_REF_NAME" --generate-notes
          else
            [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ] || {
              echo "::error::Refusing to replace assets on an already published release; use a new version"; exit 1; }
            echo "Reusing draft $GITHUB_REF_NAME"
          fi
          mkdir -p dist
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "dist/Signet-${GITHUB_REF_NAME#v}.md"

      - name: Build release zip and appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_APPCAST: '1'
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Check the build output
        # With the Sparkle key configured, a release without its appcast would silently stop
        # updates: refuse to publish it.
        run: |
          ls dist/Signet-*.zip
          if [ ! -s dist/appcast.xml ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is set but no appcast.xml was produced"; exit 1
          fi

      - name: Attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        # --clobber so a rerun replaces the assets (the appcast's signature must match the zip it
        # sits beside). Both are attached before the release becomes visible.
        run: |
          [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ] || {
            echo "::error::Release was published before asset upload; refusing mutation"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "dist/Signet-${GITHUB_REF_NAME#v}.zip" dist/appcast.xml --clobber

      - name: Publish the release
        # Only now does releases/latest (and so the update feed) move to this version.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
