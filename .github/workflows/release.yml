name: Release

# Pushing a tag like v0.2 builds the app and attaches Signet-0.2.zip to a GitHub release, plus
# appcast.xml so running copies of Signet find the update (Sparkle reads
# releases/latest/download/appcast.xml). The appcast is signed with the SPARKLE_PRIVATE_KEY
# secret (the output of Sparkle's `generate_keys -x`); without it no appcast is attached and the
# release is not offered as an update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      # The secrets context cannot be used in step `if`s, so surface presence as job env.
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.DEVELOPER_ID != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build number = commit count

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        # Optional. Add DEVELOPER_ID_P12 (base64 .p12), DEVELOPER_ID_P12_PASSWORD and
        # DEVELOPER_ID (the identity name) as repository secrets to sign for distribution.
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          # The identity is only "valid" with Apple's Developer ID G2 intermediate alongside it.
          curl -sSfO https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          echo "DEVELOPER_ID=${{ secrets.DEVELOPER_ID }}" >> "$GITHUB_ENV"

      - name: Store notarisation credentials
        # Optional. NOTARY_APPLE_ID, NOTARY_TEAM_ID and NOTARY_PASSWORD (an app-specific password).
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY == 'true'
        run: |
          xcrun notarytool store-credentials signet-notary \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" \
            --password "${{ secrets.NOTARY_PASSWORD }}"
          echo "NOTARY_PROFILE=signet-notary" >> "$GITHUB_ENV"

      - name: Create GitHub release
        # Created first (without assets) so its generated notes can go into the appcast.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Signet $GITHUB_REF_NAME" --generate-notes
          mkdir -p dist
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "dist/Signet-${GITHUB_REF_NAME#v}.md"

      - name: Build release zip and appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_APPCAST: ${{ env.HAS_SPARKLE_KEY == 'true' && '1' || '0' }}
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.zip
          if [ -f dist/appcast.xml ]; then gh release upload "$GITHUB_REF_NAME" dist/appcast.xml; fi
